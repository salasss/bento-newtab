<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil</title>
  <link rel="icon" href="img/icon-48.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="app">
    <!-- ============ En-tête : une seule ligne ============ -->
    <header class="top">
      <div class="time">
        <h1 class="clock" id="clock">--:--</h1>
        <div class="time-meta">
          <p class="greet" id="greeting">Bonjour</p>
          <p class="date" id="date"></p>
        </div>
      </div>

      <form class="search" id="search" autocomplete="off">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="Rechercher ou taper une adresse…" aria-label="Recherche">
        <div class="bangs" id="bangs"></div>
      </form>

      <div class="status">
        <div class="week-pill" id="week-pill"></div>
        <div class="progress" title="Jours école effectués sur l'année de formation">
          <div class="progress-label"><span id="progress-label">Progression</span><span id="ms-progress-txt"></span></div>
          <div class="progress-bar"><span id="ms-progress-bar"></span></div>
        </div>
      </div>

      <button class="theme-btn" id="theme-btn" type="button" title="Passer en clair" aria-label="Passer en clair">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </header>

    <!-- ============ Bento ============ -->
    <section class="bento">
      <article class="tile t-short" id="shortcuts-card" aria-label="Raccourcis">
        <div class="groups" id="groups"></div>
        <div class="add-pop" id="add-pop" role="dialog" aria-label="Ajouter un raccourci" hidden>
          <p class="add-title">Ajouter à <b id="add-group"></b></p>
          <form id="add-form" autocomplete="off">
            <input id="add-url" type="text" placeholder="Adresse, ex. github.com" aria-label="Adresse du site">
            <input id="add-name" type="text" placeholder="Nom (facultatif)" maxlength="40" aria-label="Nom affiché">
            <p class="add-err" id="add-err" hidden></p>
            <div class="add-row">
              <button type="button" class="btn ghost" id="add-cancel">Annuler</button>
              <button type="submit" class="btn primary">Ajouter</button>
            </div>
          </form>
        </div>
      </article>

      <article class="tile t-wx weather" id="weather-card" data-sky="cloud">
        <div class="tile-head">
          <h2>Météo</h2>
          <a class="wx-credit" href="https://open-meteo.com/" rel="noreferrer" title="Données météo : Open-Meteo.com (CC BY 4.0)">Open-Meteo</a>
          <button class="city-btn" id="city-btn" title="Changer de ville"><span id="city-name">—</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
        <div class="city-search" id="city-search" hidden>
          <input id="city-q" type="text" placeholder="Chercher une ville…" aria-label="Ville">
          <ul id="city-results"></ul>
        </div>
        <div class="wx-now" id="wx-now"></div>
        <div class="wx-hours" id="wx-hours"></div>
        <div class="wx-days" id="wx-days"></div>
      </article>

      <article class="tile t-dl" id="deadlines-card">
        <div class="tile-head"><h2 id="dl-title">Échéances</h2><span class="head-meta" id="dl-meta"></span></div>
        <ul class="deadlines scroll" id="deadlines"></ul>
      </article>

      <article class="tile t-news" id="news-card">
        <div class="tile-head">
          <h2>Actus</h2>
          <div class="seg" role="tablist" id="news-tabs">
            <button role="tab" data-tab="cyber" class="on">Cyber</button>
            <button role="tab" data-tab="devops">DevOps</button>
          </div>
          <span class="head-meta" id="news-meta"></span>
          <button class="icon-btn" id="news-refresh" title="Actualiser" aria-label="Actualiser les actus">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
        </div>
        <ul class="news scroll" id="news-list"></ul>
      </article>

      <article class="tile t-alert" id="alerts-card">
        <div class="tile-head"><h2>Alertes cyber</h2><span class="head-meta" id="alerts-meta"></span></div>
        <div class="alerts scroll">
          <h3 class="sub">CERT-FR <span>ANSSI</span></h3>
          <ul class="alist" id="certfr-list"></ul>
          <h3 class="sub">Failles exploitées <span>KEV · CISA</span></h3>
          <ul class="alist" id="kev-list"></ul>
        </div>
      </article>

      <article class="tile t-pomo pomo" id="pomo-card">
        <div class="tile-head">
          <h2>Pomodoro</h2>
          <div class="seg small" id="pomo-modes">
            <button data-mode="focus" class="on">Focus</button>
            <button data-mode="short">Pause</button>
            <button data-mode="long">Longue</button>
          </div>
        </div>
        <div class="pomo-body">
          <div class="ring">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
              <circle class="ring-bg" cx="60" cy="60" r="52"/>
              <circle class="ring-fg" id="pomo-ring" cx="60" cy="60" r="52"/>
            </svg>
            <div class="ring-txt"><strong id="pomo-time">25:00</strong><span id="pomo-cycle">Session 1/4</span></div>
          </div>
          <div class="pomo-ctrl">
            <button class="btn primary" id="pomo-start">Démarrer</button>
            <div class="pomo-row">
              <button class="btn" id="pomo-reset" title="Réinitialiser">Reset</button>
              <button class="btn ghost" id="pomo-skip" title="Passer à l'étape suivante">Passer</button>
            </div>
          </div>
        </div>
      </article>

      <article class="tile t-todo" id="todo-card">
        <div class="tile-head">
          <h2>À faire</h2><span class="head-meta" id="todo-meta"></span>
          <button class="link-btn" id="todo-clear" hidden>Effacer terminées</button>
        </div>
        <form id="todo-form" class="todo-form" autocomplete="off">
          <input id="todo-in" type="text" placeholder="Nouvelle tâche + Entrée" maxlength="200" aria-label="Nouvelle tâche">
        </form>
        <ul class="todo scroll" id="todo-list"></ul>
      </article>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
